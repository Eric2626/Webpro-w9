<head>

  <style>
    :root { color-scheme:dark; font-family:system-ui,Arial,sans-serif; background:#0f172a; color:#f8fafc; }

    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:2rem; line-height:1.6; }

  </style>
</head>

  <main>
    <p class="code" aria-hidden="true">404</p>
